services:
  - type: web
    name: ai-ml-studybot
    runtime: python
    plan: free
    rootDir: ai_ml_chatbot
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false

