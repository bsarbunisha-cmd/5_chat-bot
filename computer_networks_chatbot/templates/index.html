<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Networks StudyBot</title>
<style>
:root {
  --a:#f97316; --b:#facc15; --bg:#070a12;
  --text:#edf2f7; --muted:#8c98aa; --line:rgba(255,255,255,.11);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,sans-serif;background:var(--bg)}
button,textarea{font:inherit}
textarea{outline:none}

body{background:#020617}.app{width:100%;min-height:100vh;display:grid;grid-template-rows:70px 1fr auto;background:radial-gradient(circle at 50% 20%,rgba(249,115,22,.08),transparent 35%),#020617}
.top{padding:0 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(2,6,23,.75);backdrop-filter:blur(15px)}.brand{display:flex;gap:12px;align-items:center}.mark{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));color:#111827}.top small{color:#64748b}.network-status{color:#fbbf24;font-size:11px}.chat{overflow:auto;padding:35px 6%}.hero{text-align:center;max-width:720px;margin:9vh auto}.signal{width:100px;height:100px;margin:auto;position:relative}.signal:before,.signal:after{content:"";position:absolute;inset:10px;border:1px solid rgba(249,115,22,.35);border-radius:50%;animation:pulse 2.5s infinite}.signal:after{inset:30px;border-color:rgba(250,204,21,.55)}@keyframes pulse{50%{transform:scale(1.25);opacity:.2}}.hero h1{font-size:46px;letter-spacing:-.055em;margin:22px 0 10px}.hero p{color:#7c8aa0;line-height:1.8}.msg{max-width:820px;margin:0 auto 16px;display:flex}.msg.user{justify-content:flex-end}.bubble{max-width:80%;padding:14px 17px;border-radius:17px;font-size:14px;line-height:1.65;white-space:pre-wrap}.user .bubble{background:linear-gradient(135deg,#ea580c,#facc15);color:#111827}.model .bubble{background:rgba(15,23,42,.8);border:1px solid rgba(255,255,255,.08)}.compose{padding:17px 6% 24px;border-top:1px solid rgba(255,255,255,.08);background:#020617}form{max-width:820px;margin:auto;display:flex;gap:9px;padding:8px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:#0b1220}textarea{flex:1;background:transparent;border:0;resize:none;color:white;padding:12px;min-height:48px}button{width:52px;height:48px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--a),var(--b));cursor:pointer;color:#111827}.hint{text-align:center;color:#475569;font-size:9px;margin-top:7px}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="brand"><div class="mark">⌁</div><div><strong>Computer Networks StudyBot</strong><br><small>PACKET ROOM</small></div></div><span class="network-status">● LINK ACTIVE</span></header><section class="chat" id="chat"><div class="hero" id="welcome"><div class="signal"></div><h1>Connect the concepts.</h1><p>Explore Computer Networks through clear explanations, protocol flows, addressing examples, and exam-focused answers.</p></div></section><div class="compose"><form id="chat-form"><textarea id="message" placeholder="Send a study packet..." rows="1"></textarea><button id="send" type="submit">↗</button></form><div class="hint">PACKET TYPE: ACADEMIC · CHANNEL: COMPUTER NETWORKS</div></div></div>
<script>
const form=document.getElementById("chat-form");
const input=document.getElementById("message");
const send=document.getElementById("send");
const chat=document.getElementById("chat");
const welcome=document.getElementById("welcome");
const history=[];

function addMessage(role,text){
  if(welcome) welcome.remove();
  const row=document.createElement("div");
  row.className="msg "+role;
  const bubble=document.createElement("div");
  bubble.className="bubble";
  bubble.textContent=text;
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop=chat.scrollHeight;
}

function loading(value){
  send.disabled=value;
  input.disabled=value;
  send.textContent=value?"...":"↑";
}

async function sendMessage(){
  const message=input.value.trim();
  if(!message||send.disabled)return;
  addMessage("user",message);
  history.push({role:"user",text:message});
  input.value="";
  input.style.height="auto";
  loading(true);

  try{
    const response=await fetch("/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message,history:history.slice(-10)})
    });
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||"Request failed.");
    addMessage("model",data.answer);
    history.push({role:"model",text:data.answer});
  }catch(error){
    addMessage("model",error.message||"Something went wrong.");
  }finally{
    loading(false);
    input.focus();
  }
}

form.addEventListener("submit",e=>{e.preventDefault();sendMessage();});
input.addEventListener("input",()=>{
  input.style.height="auto";
  input.style.height=Math.min(input.scrollHeight,130)+"px";
});
input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}
});
</script>
</body>
</html>
